name: build

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          [
            ubuntu-22.04,
            ubuntu-24.04,
            windows-2025,
            windows-2022,
            macos-26,
            macos-15,
          ]
        toolchain: [stable]
        include:
          - os: ubuntu-24.04
            toolchain: beta
          - os: ubuntu-24.04
            toolchain: nightly
          - os: ubuntu-24.04
            toolchain: "1.88" # MSRV
    steps:
      - name: Install Rust ${{ matrix.toolchain }}
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --verbose
        continue-on-error: ${{ matrix.toolchain == 'beta' || matrix.toolchain == 'nightly' }}
      - name: Run tests
        run: cargo test --verbose
        continue-on-error: ${{ matrix.toolchain == 'beta' || matrix.toolchain == 'nightly' }}

  clippy:
    name: clippy (ubuntu-latest, stable)
    runs-on: ubuntu-latest
    steps:
      - name: Install latest stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Checkout sources
        uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      - name: Cargo Clippy
        run: cargo clippy --all-targets -- -D warnings

  fmt:
    name: fmt (ubuntu-latest, stable)
    runs-on: ubuntu-latest
    steps:
      - name: Install latest stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Checkout sources
        uses: actions/checkout@v7
      - name: Check Formatting
        run: cargo fmt --all -- --check
